    <script>
function resizeMasonryItem(item) {
    const grid = document.querySelector('.gallery');
    const rowHeight = parseInt(window.getComputedStyle(grid).getPropertyValue('grid-auto-rows'));
    const rowGap = parseInt(window.getComputedStyle(grid).getPropertyValue('gap'));
    const itemContentHeight = item.getBoundingClientRect().height;
    const rowSpan = Math.ceil((itemContentHeight + rowGap) / (rowHeight + rowGap));
    item.style.gridRowEnd = `span ${rowSpan}`;
}

function resizeAllMasonryItems() {
    const allItems = document.querySelectorAll('.gallery > *');
    allItems.forEach(item => resizeMasonryItem(item));
}

// 🎲 Appliquer une taille random à certains éléments
function randomizeItemSize() {
    const items = document.querySelectorAll('.gallery-item');
    items.forEach(item => {
        const rand = Math.random();
        if (rand < 0.15) {
            item.classList.add('x-tall'); // très grand
        } else if (rand < 0.4) {
            item.classList.add('tall'); // moyennement grand
        }
    });
}

window.addEventListener('load', () => {
    randomizeItemSize();
    resizeAllMasonryItems();
});

window.addEventListener('resize', resizeAllMasonryItems);

// Pour les images/vidéos qui chargent après
document.querySelectorAll('.gallery img, .gallery video').forEach(el => {
    el.addEventListener('load', () => resizeMasonryItem(el));
    el.addEventListener('loadedmetadata', () => resizeMasonryItem(el));
});
</script>

    <script>
function resizeMasonryItem(item) {
    const grid = document.querySelector('.gallery');
    const rowHeight = parseInt(window.getComputedStyle(grid).getPropertyValue('grid-auto-rows'));
    const rowGap = parseInt(window.getComputedStyle(grid).getPropertyValue('gap'));
    const itemContentHeight = item.getBoundingClientRect().height;
    const rowSpan = Math.ceil((itemContentHeight + rowGap) / (rowHeight + rowGap));
    item.style.gridRowEnd = `span ${rowSpan}`;
}

function resizeAllMasonryItems() {
    const allItems = document.querySelectorAll('.gallery > *');
    allItems.forEach(item => resizeMasonryItem(item));
}

// Resize on load and on window resize
window.addEventListener('load', resizeAllMasonryItems);
window.addEventListener('resize', resizeAllMasonryItems);

// Optional: Recalculate after media is fully loaded
document.querySelectorAll('.gallery img, .gallery video').forEach(el => {
    el.addEventListener('load', () => resizeMasonryItem(el.parentElement || el));
    el.addEventListener('loadedmetadata', () => resizeMasonryItem(el.parentElement || el)); // for video
});
</script>

<script>
const scrollThumb = document.querySelector('.scroll-thumb');

function updateScrollBar() {
    let scrollTop = window.scrollY;
    let pageHeight = document.documentElement.scrollHeight - window.innerHeight;
    let scrollPercentage = (scrollTop / pageHeight) * 100;
    scrollThumb.style.top = scrollPercentage + "%";
}

window.addEventListener('scroll', updateScrollBar);
</script>
